<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a2846">
<title>Carnet de Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a study notebook. Sticky tab bar; each tab is one section (course map, grammar, verbs, phrases, vocabulary, worksheets). Same family as the verb sheets: Young Serif + Figtree, bordeaux ink. */
:root{
  --bg:#f8f5f6; --surface:#ffffff; --fg:#241519; --muted:#6e5a61; --line:#e6dbdf;
  --accent:#8a2846; --accent-soft:#f6e4ea; --irr:#a35f00;
  --ok:#2f7a4a; --ok-soft:#e3f2e8; --bad:#b3261e; --bad-soft:#fbe6e4; --warn:#8a6100; --warn-soft:#fbf0d6;
  --display:"Young Serif", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#170e11; --surface:#22161a; --fg:#f3e9ec; --muted:#b8a2aa; --line:#3a2830;
  --accent:#f19ab3; --accent-soft:#3b1d27; --irr:#e6b45c;
  --ok:#7fd19b; --ok-soft:#173022; --bad:#f2958d; --bad-soft:#3a1a18; --warn:#e8c46a; --warn-soft:#352a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170e11; --surface:#22161a; --fg:#f3e9ec; --muted:#b8a2aa; --line:#3a2830;
  --accent:#f19ab3; --accent-soft:#3b1d27; --irr:#e6b45c;
  --ok:#7fd19b; --ok-soft:#173022; --bad:#f2958d; --bad-soft:#3a1a18; --warn:#e8c46a; --warn-soft:#352a12; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .in{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.bar .in::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:7px 12px;border-radius:8px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:grid;gap:20px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1}
h2{font-size:26px;color:var(--accent)}
h3{margin:0;font-size:16px}
.lede{margin:6px 0 0;color:var(--muted);max-width:64ch}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 14px var(--body);padding:6px 12px;border-radius:8px;cursor:pointer}
.chip.irr{color:var(--irr)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h3{color:var(--accent);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.tag.irr{color:var(--irr)}
.tag.muted{background:none;border:1px solid var(--line);color:var(--muted)}
table{border-collapse:collapse;width:100%}
td,th{padding:6px 0;border-top:1px solid var(--line);vertical-align:baseline;text-align:left}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.p{color:var(--muted);font-size:13px;width:34%;padding-right:8px}
td.f{font-weight:600}
td.en{color:var(--muted);font-size:13.5px;padding-left:10px}
.fr{font-weight:600}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.wide{min-width:900px}
.wide th,.wide td{padding:8px 12px;white-space:nowrap}
.wide td:first-child{font-family:var(--display);color:var(--accent);font-size:16px}
ul.ex{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}
ul.ex li::marker{color:var(--accent)}
.note{font-size:13.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px;margin-top:10px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);width:max-content}
.toggle button{border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:6px 14px;border-radius:999px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
/* course map */
.units{display:grid;gap:10px}
.unit{display:grid;grid-template-columns:56px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;align-items:start}
.unit.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.unit .n{font-family:var(--display);font-size:34px;line-height:1;color:var(--accent)}
.unit .t{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.unit .t h3{font-family:var(--display);font-weight:400;font-size:20px}
.unit .pg{font-size:12.5px;color:var(--muted)}
.unit .rows{display:grid;gap:3px;margin-top:6px;font-size:13.5px}
.unit .rows b{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.unit .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.linkbtn{border:1px solid var(--accent);background:none;color:var(--accent);font:600 13px var(--body);padding:4px 10px;border-radius:7px;cursor:pointer}
.setnow{border:0;background:none;color:var(--muted);font:500 12.5px var(--body);text-decoration:underline;cursor:pointer;padding:0}
/* worksheets */
.sheet{display:grid;gap:14px}
.exo{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;min-width:0}
.exo .hd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.exo .hd h3{font-size:16px}
.exo .hd .ref{font-size:12.5px;color:var(--muted)}
.exo .instr{margin:0;color:var(--muted);font-size:14px}
.items{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:it}
.items li{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:baseline;counter-increment:it}
.items li::before{content:counter(it, lower-alpha) ".";color:var(--accent);font-weight:600;font-size:13px}
.q{line-height:2.1}
.q input[type=text]{font:600 15px var(--body);color:var(--fg);background:var(--bg);border:0;border-bottom:1.5px solid var(--muted);padding:2px 4px;min-width:5ch;max-width:100%;border-radius:4px 4px 0 0}
.q input.long{width:min(100%,30ch)}
.q input.ok{border-color:var(--ok);background:var(--ok-soft)}
.q input.bad{border-color:var(--bad);background:var(--bad-soft)}
.q input.warn{border-color:var(--warn);background:var(--warn-soft)}
.q .hint{color:var(--muted);font-size:13px}
.q .sol{display:inline-block;margin-left:6px;font-size:13.5px;color:var(--ok);font-weight:600}
.opts{display:inline-flex;flex-wrap:wrap;gap:6px;margin-left:4px}
.opt{border:1px solid var(--line);background:var(--bg);color:var(--fg);font:600 13.5px var(--body);padding:3px 11px;border-radius:999px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;min-height:120px;font:15px/1.5 var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.wc{font-size:12.5px;color:var(--muted)}
.model{background:var(--accent-soft);border-radius:8px;padding:12px;font-size:14.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--bg);font:600 13.5px var(--body);padding:7px 14px;border-radius:8px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.status{font-size:13px;color:var(--muted)}
.wordbank{display:flex;flex-wrap:wrap;gap:6px}
.wordbank span{border:1px dashed var(--line);border-radius:6px;padding:2px 8px;font-size:13.5px;font-weight:600}
.cols2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:4px 18px}
@media (prefers-reduced-motion:no-preference){.exo{transition:border-color .2s}}
</style>
</head>

<script>
/* ---------- course map (from Édito A1, tableau des contenus) ---------- */
const UNITS=[
 {n:0,t:"Bienvenue !",p:11,g:["Les pronoms (je, tu… moi, toi, vous)","Tu ou vous"],v:["Salutations","L'alphabet","Les nombres 0 à 31","Les jours et les mois","Dans la classe"],verbs:[],sheet:"f0",gr:["pronoms","tuvous","negation"],ph:["saluer","cava","classe","date"],vo:["n0","jours","mois"]},
 {n:1,t:"Je suis…",p:17,g:["Les adjectifs de nationalité","Les articles définis le, la, l', les","Les prépositions devant les villes et pays (1)","L'adjectif interrogatif quel"],v:["Les loisirs (1)","Les nombres 32 à 100","Les pays et nationalités","L'identité, les coordonnées"],verbs:["avoir","s'appeler","être","parler"],sheet:"f1",gr:["nationalite","articles","prepositions","quel"],ph:["presenter","coordonnees"],vo:["n32","n70","pays","loisirs","identite"]},
 {n:2,t:"Près de moi",p:31,g:["Articles définis et indéfinis","Les verbes en -er au présent (aimer, détester)","Les adjectifs possessifs","Masculin et féminin des professions"],v:["Les lieux","Les loisirs (2)","La famille","Les professions"],verbs:["habiter","aimer"]},
 {n:3,t:"Qu'est-ce qu'on mange ?",p:45,g:["Singulier et pluriel des noms","Les prépositions de lieu (1)","Les partitifs, un peu de, beaucoup de, pas de","Les verbes en -ir (choisir, finir)"],v:["Les commerces, les aliments","Les quantités, le paiement","Les repas, les boissons"],verbs:["acheter","payer","aller","manger","faire","finir"]},
 {n:4,t:"C'est où ?",p:59,g:["C'est un(e) / Il, elle est","La fréquence (jamais, souvent, toujours)","L'impératif","Les connecteurs (pour, parce que, mais…)"],v:["La ville, les monuments","Les transports","Les nombres 100 à 1 milliard"],verbs:["prendre"]},
 {n:5,t:"C'est tendance !",p:73,g:["Genre et nombre des adjectifs","La place des adjectifs","L'adjectif démonstratif"],v:["Les vêtements, les couleurs","La météo","Les objets du quotidien"],verbs:["vendre","mettre","venir"]},
 {n:6,t:"Qu'est-ce qu'on fait aujourd'hui ?",p:87,g:["Les verbes pronominaux","La fréquence (2)","Le passé récent","Les verbes en -ir (2) partir, sortir, dormir"],v:["L'heure","Les activités quotidiennes","Les sorties","Description physique, caractère"],verbs:["pouvoir","vouloir","partir"]},
 {n:7,t:"Chez moi !",p:101,g:["Le passé composé (1) avec avoir","Les prépositions de lieu (2)","L'obligation et l'interdiction (1)","Les pronoms COD le, la, l', les"],v:["Le logement, les pièces, les meubles","L'immeuble, les réparations"],verbs:["connaître"]},
 {n:8,t:"En forme !",p:115,g:["Le passé composé (2) avec être","Le pronom y","L'obligation (2) devoir","Le conseil"],v:["Le corps et la santé","Le sport, l'alimentation"],verbs:["devoir"]},
 {n:9,t:"Bonnes vacances !",p:129,g:["La comparaison","Les prépositions de villes et pays (2)","Le passé composé (3)","L'imparfait (c'était, il y avait, il faisait)"],v:["Les vacances, l'hébergement","La nature"],verbs:[]},
 {n:10,t:"Au travail !",p:143,g:["Les pronoms COD (2)","La durée","Les pronoms relatifs qui et que","L'intensité"],v:["L'université, les études","L'entreprise, la vie professionnelle"],verbs:[]}
];

/* ---------- grammar ---------- */
const GR=[
 {id:"pronoms",u:0,t:"Les pronoms sujets et toniques",
  h:`<table><tr><th>Sujet</th><th>Tonique</th><th></th></tr>
  <tr><td class="f">je (j')</td><td class="f">moi</td><td class="en">I / me</td></tr>
  <tr><td class="f">tu</td><td class="f">toi</td><td class="en">you (informal)</td></tr>
  <tr><td class="f">il / elle / on</td><td class="f">lui / elle</td><td class="en">he / she / we</td></tr>
  <tr><td class="f">nous</td><td class="f">nous</td><td class="en">we</td></tr>
  <tr><td class="f">vous</td><td class="f">vous</td><td class="en">you (plural or polite)</td></tr>
  <tr><td class="f">ils / elles</td><td class="f">eux / elles</td><td class="en">they</td></tr></table>
  <p class="note">A French verb always needs its subject pronoun. The tonic form adds emphasis or stands alone: <i>Moi, je…</i>, <i>Et toi ?</i></p>
  <ul class="ex"><li><span class="fr">Moi, je m'appelle Chefen. Et toi ?</span></li><li><span class="fr">Bonjour monsieur, et vous ?</span></li></ul>`},
 {id:"tuvous",u:0,t:"Tu ou vous ?",
  h:`<p><b>tu</b> for family, friends, children, and people your age in casual settings.<br><b>vous</b> for someone you don't know, to be polite, at work with clients, and for any group.</p>
  <ul class="ex"><li><span class="fr">Salut Léa, tu vas bien ?</span></li><li><span class="fr">Bonjour madame, vous allez bien ?</span></li></ul>
  <p class="note">When in doubt, use <i>vous</i>. The other person will tell you if <i>tu</i> is fine: <i>On peut se tutoyer ?</i></p>`},
 {id:"negation",u:0,t:"La négation ne… pas",lv:"preview",
  h:`<p><b>ne</b> before the verb, <b>pas</b> after it. <b>ne</b> becomes <b>n'</b> before a vowel.</p>
  <ul class="ex"><li><span class="fr">Je ne comprends pas.</span> I don't understand.</li><li><span class="fr">Je n'aime pas le sport.</span></li><li><span class="fr">Elle n'est pas française.</span></li></ul>
  <p class="note">In speech the <i>ne</i> often disappears: <i>Je sais pas.</i> Keep it when you write.</p>`},
 {id:"nationalite",u:1,t:"Les adjectifs de nationalité",
  h:`<table><tr><th>Rule</th><th>Masculin</th><th>Féminin</th></tr>
  <tr><td class="p">add -e</td><td class="f">français</td><td class="f">française</td></tr>
  <tr><td class="p">add -e</td><td class="f">allemand</td><td class="f">allemande</td></tr>
  <tr><td class="p">-ien → -ienne</td><td class="f">italien</td><td class="f">italienne</td></tr>
  <tr><td class="p">-éen → -éenne</td><td class="f">coréen</td><td class="f">coréenne</td></tr>
  <tr><td class="p">ends in -e: same</td><td class="f">suisse</td><td class="f">suisse</td></tr>
  <tr><td class="p">special</td><td class="f">grec / turc</td><td class="f">grecque / turque</td></tr></table>
  <p class="note">Listen for the difference: the final consonant is silent in the masculin and pronounced in the féminin (<i>françai<b>s</b></i> vs <i>françai<b>se</b></i>). Nationality adjectives take no capital letter.</p>
  <ul class="ex"><li><span class="fr">Il est suédois. Elle est suédoise.</span></li><li><span class="fr">Vous êtes portugaise, madame ?</span></li></ul>`},
 {id:"articles",u:1,t:"Les articles définis le, la, l', les",
  h:`<table><tr><th></th><th>Singulier</th><th>Pluriel</th></tr>
  <tr><td class="p">Masculin</td><td class="f">le / l'</td><td class="f" rowspan="2">les</td></tr>
  <tr><td class="p">Féminin</td><td class="f">la / l'</td></tr></table>
  <p>Use <b>l'</b> before a vowel or a silent h: <i>l'art, l'histoire</i>.<br>Use them to talk about things in general, especially after <i>aimer</i>: <i>J'aime <b>la</b> musique.</i></p>
  <p class="note">Countries take an article. Ending in -e: feminine (<i>la France, l'Italie</i>). Exceptions: <i>le Mexique, le Mozambique, le Cambodge, le Zimbabwe</i>. Ending in -s: plural (<i>les États-Unis, les Pays-Bas</i>).</p>`},
 {id:"prepositions",u:1,t:"À, au, en, aux + villes et pays",
  h:`<table><tr><th>Before</th><th>Use</th><th>Example</th></tr>
  <tr><td class="p">a city</td><td class="f">à</td><td>à Lisbonne, à Göteborg</td></tr>
  <tr><td class="p">masculine country</td><td class="f">au</td><td>au Portugal, au Japon</td></tr>
  <tr><td class="p">feminine country, or starts with a vowel</td><td class="f">en</td><td>en Suède, en France, en Iran</td></tr>
  <tr><td class="p">plural country</td><td class="f">aux</td><td>aux États-Unis, aux Pays-Bas</td></tr></table>
  <ul class="ex"><li><span class="fr">J'habite à Lisbonne, au Portugal.</span></li><li><span class="fr">Il est né en Argentine.</span></li></ul>`},
 {id:"quel",u:1,t:"L'adjectif interrogatif quel",
  h:`<table><tr><th></th><th>Singulier</th><th>Pluriel</th></tr>
  <tr><td class="p">Masculin</td><td class="f">quel</td><td class="f">quels</td></tr>
  <tr><td class="p">Féminin</td><td class="f">quelle</td><td class="f">quelles</td></tr></table>
  <p><b>quel</b> means "which / what" and agrees with the noun it goes with. All four forms sound the same.</p>
  <ul class="ex"><li><span class="fr">Quel est ton numéro ?</span> (le numéro)</li><li><span class="fr">Tu habites dans quelle ville ?</span> (la ville)</li><li><span class="fr">Tu parles quelles langues ?</span> (les langues)</li></ul>`}
];

/* ---------- phrases ---------- */
const PH=[
 {id:"saluer",u:0,t:"Saluer",r:[["Bonjour (madame / monsieur)","Hello (polite)"],["Salut !","Hi / bye (informal)"],["Bonsoir","Good evening"],["Au revoir","Goodbye"],["À bientôt ! / À plus !","See you soon"],["À demain ! / À lundi !","See you tomorrow / Monday"],["Bonne journée !","Have a good day"],["Ciao !","Bye (informal)"]]},
 {id:"cava",u:0,t:"Ça va ?",r:[["Ça va ?","How's it going?"],["Oui, ça va, et toi ?","Fine, and you?"],["Ça va bien, merci.","Good, thanks."],["Tu vas bien ?","Are you well? (tu)"],["Vous allez bien ?","Are you well? (vous)"],["Très bien, merci. Et vous ?","Very well, thanks. And you?"]]},
 {id:"classe",u:0,t:"Dans la classe",r:[["Je ne comprends pas.","I don't understand."],["Vous pouvez répéter, s'il vous plaît ?","Can you repeat, please?"],["Comment ça s'écrit ?","How is that spelled?"],["Comment on dit… en français ?","How do you say… in French?"],["Excusez-moi, je suis en retard.","Sorry, I'm late."],["S'il vous plaît / S'il te plaît","Please (vous / tu)"],["Pardon / Excusez-moi / Excuse-moi","Sorry / Excuse me"]]},
 {id:"date",u:0,t:"Dire la date",r:[["Aujourd'hui, c'est mardi.","Today is Tuesday."],["Demain, c'est mercredi.","Tomorrow is Wednesday."],["On est le 12 octobre.","It's 12 October."],["le premier mai","1 May (1st is always premier)"]]},
 {id:"presenter",u:1,t:"Se présenter",r:[["Comment vous vous appelez ? / Comment tu t'appelles ?","What's your name?"],["Je m'appelle… / Moi, c'est…","My name is… / I'm…"],["Vous êtes hollandais(e) ? / Tu es…","Are you Dutch?"],["Non, je suis…","No, I'm…"],["Vous avez quel âge ? / Tu as quel âge ?","How old are you?"],["J'ai 30 ans.","I'm 30. (avoir, not être)"],["J'habite à…","I live in…"],["Je suis né(e) à…","I was born in…"],["J'aime la musique et le sport.","I like music and sport."]]},
 {id:"coordonnees",u:1,t:"Donner ses coordonnées",r:[["Quel est ton numéro de téléphone ?","What's your phone number?"],["C'est le 06 80 72 86 45.","It's… (read in pairs)"],["Quel est ton mail ?","What's your email?"],["@ arobase · . point","@ at · . dot"],["Tu as Instagram ?","Do you have Instagram?"]]}
];

/* ---------- vocabulary ---------- */
const N0=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf","vingt","vingt et un","vingt-deux","vingt-trois","vingt-quatre","vingt-cinq","vingt-six","vingt-sept","vingt-huit","vingt-neuf","trente","trente et un"];
const VO=[

const TABS=[["cours","Mon cours"],["grammaire","Grammaire"],["verbes","Verbes"],["phrases","Phrases"],["vocab","Vocabulaire"],["fiches","Fiches"]];

function tabs(){
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${S.tab===k}" data-k="${k}">${l}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.k));
}
function go(k,anchor){S.tab=k;save();render();if(anchor){const el=document.getElementById(anchor);if(el){el.scrollIntoView({block:"start"});return}}window.scrollTo(0,0)}

      u.ph?`<button class="linkbtn" data-go="phrases" data-a="u${u.n}p">Phrases</button>`:""].join("");
    return `<div class="unit${now?" now":""}"><div class="n">${u.n}</div><div style="min-width:0">
      <div class="t"><h3>${esc(u.t)}</h3><span class="pg">p. ${u.p}</span>${now?`<span class="tag">You are here</span>`:`<button class="setnow" data-u="${u.n}">I'm on this unit</button>`}</div>
      <div class="rows"><div><b>Grammaire</b>${u.g.map(esc).join(" · ")}</div><div><b>Vocabulaire</b>${u.v.map(esc).join(" · ")}</div>${u.verbs.length?`<div><b>Verbes</b>${u.verbs.join(", ")}</div>`:""}</div>
      ${links?`<div class="links">${links}</div>`:`<div class="pg" style="margin-top:6px">Worksheet and notes added when you reach this unit.</div>`}
    </div></div>`}).join("")}</div>`;
}
function grouped(list,suffix,renderItem){
  const us=[...new Set(list.map(x=>x.u))];
  return us.map(u=>`<section id="u${u}${suffix}" style="display:grid;gap:12px;scroll-margin-top:70px"><div class="eyebrow">Unité ${u} · ${esc(UNITS[u].t)}</div><div class="grid">${list.filter(x=>x.u===u).map(renderItem).join("")}</div></section>`).join("");
}
function vGrammaire(){
  return `<header><h1>Grammaire</h1><p class="lede">One card per rule, in the order your book teaches them.</p></header>`+
   grouped(GR,"g",g=>`<div class="card"><h3>${esc(g.t)}</h3>${g.lv?`<p style="margin:0 0 6px"><span class="tag muted">Preview, taught later</span></p>`:""}${g.h}</div>`);
}
function rows(r,cols){return `<table>${r.map(([a,b])=>`<tr><td class="f">${esc(a)}</td><td class="en">${esc(b)}</td></tr>`).join("")}</table>`}
function vPhrases(){
  return `<header><h1>Phrases</h1><p class="lede">Ready-to-use sentences, grouped by situation.</p></header>`+
   grouped(PH,"p",p=>`<div class="card"><h3>${esc(p.t)}</h3>${rows(p.r)}</div>`);
}
function vVocab(){
  return `<header><h1>Vocabulaire</h1><p class="lede">Word lists by topic. (m.) and (f.) mark masculine and feminine.</p></header>`+
   grouped(VO,"v",v=>`<div class="card"${v.r.length>15?' style="grid-column:1/-1"':""}><h3>${esc(v.t)}</h3>${v.r.length>15?`<div class="cols2">${v.r.map(([a,b])=>`<div style="display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:5px 0"><span class="fr">${esc(a)}</span><span class="en" style="color:var(--muted);font-size:13.5px">${esc(b)}</span></div>`).join("")}</div>`:rows(v.r)}${v.note?`<p class="note">${esc(v.note)}</p>`:""}</div>`);
}
const pron=(i,f)=>i===0&&/^[aeiouyhéèêâîôû]/i.test(f)?"j'":PERSONS[i];
function vVerbes(){
  const head=`<header><h1>Verbes</h1><p class="lede">${V.length} verbs in six tenses. The tag shows the unit where your book introduces each one. At A1, focus on the présent, then the passé composé from Unit 7.</p></header>
  <div class="toggle" role="group" aria-label="View"><button id="vm-verb" aria-pressed="${S.vmode==="verb"}">By verb</button><button id="vm-tense" aria-pressed="${S.vmode==="tense"}">By tense</button></div>`;
  let pick,body;
  if(S.vmode==="verb"){
    const x=V[S.vi]||V[0];
    pick=`<div class="chips">${V.map((y,i)=>`<button class="chip${y.irr?" irr":""}" aria-pressed="${i===S.vi}" data-vi="${i}">${esc(y.v)}</button>`).join("")}</div>`;
    body=`<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px"><h2 style="font-size:32px">${esc(x.v)}</h2><span style="font-size:16px">${esc(x.g)}</span><span class="tag${x.irr?" irr":""}">${x.irr?"irregular":"regular"}</span>${utag(x.u)}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;color:var(--muted)"><span>Past participle: <b style="color:var(--fg)">${x.pp}</b>${x.note?` (${x.note})`:""}</span><span>Passé composé with: <b style="color:var(--fg)">${x.aux}</b></span></div>
    <p style="margin:0;font-size:14px;color:var(--muted)">e.g. <i style="color:var(--fg)">${esc(x.ex)}</i></p>
    <div class="grid">${TENSES.map(([k,n,u])=>`<div class="card"><h3>${n}</h3><p style="margin:0 0 8px;font-size:12.5px;color:var(--muted)">${u}</p><table>${PERSONS.map((p,i)=>`<tr><td class="p">${pron(i,x[k][i])}</td><td class="f">${x[k][i]}</td></tr>`).join("")}</table></div>`).join("")}</div>`;
  }else{
    const [k,n,u]=TENSES[S.ti];
    pick=`<div class="chips">${TENSES.map((t,i)=>`<button class="chip" aria-pressed="${i===S.ti}" data-ti="${i}">${t[1]}</button>`).join("")}</div>`;
    body=`<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px"><h2 style="font-size:32px">${n}</h2><span>${u}</span></div>
    <div class="scroll"><table class="wide"><thead><tr><th>Verb</th>${PERSONS.map(p=>`<th>${p}</th>`).join("")}</tr></thead><tbody>${V.map(x=>`<tr><td${x.irr?` style="color:var(--irr)"`:""}>${esc(x.v)}</td>${x[k].map((f,i)=>`<td>${i===0&&pron(0,f)==="j'"?"j'"+f:f}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  return head+pick+`<section style="display:grid;gap:14px">${body}</section>`;
}

/* worksheets */
const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[?!.,;:«»"]/g," ").replace(/-/g," ").replace(/'\s+/g,"'").replace(/\s+/g," ").trim();
const deacc=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
function grade(val,answers){
  const v=norm(val||""); if(!v) return "";
  const A=answers.map(norm);
  if(A.includes(v)) return "ok";
  if(A.map(deacc).includes(deacc(v))) return "warn";
  return "bad";
}
function vFiches(){
  const f=FICHES.find(x=>x.id===S.fiche)||FICHES[0];
  const a=S.ans[f.id]||{};
  const pick=`<div class="chips">${FICHES.map(x=>`<button class="chip" aria-pressed="${x.id===f.id}" data-f="${x.id}">${esc(x.t)}</button>`).join("")}</div>`;
  const exos=f.exos.map((e,ei)=>{
    const key=k=>`${ei}.${k}`;
    const st=a["chk"+ei], show=a["sol"+ei];
    let inner="";
    if(e.type==="input"){
      inner=`${e.bank?`<div class="wordbank">${e.bank.map(w=>`<span>${esc(w)}</span>`).join("")}</div>`:""}<ol class="items">${e.items.map((it,ii)=>{
        const val=a[key(ii)]||""; const g=st?grade(val,it.a):"";
        const inp=`<input type="text" id="i-${f.id}-${ei}-${ii}" data-k="${key(ii)}" class="${it.long?"long ":""}${g}" value="${esc(val)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer ${ii+1}" size="${it.long?28:Math.max(6,Math.max(...it.a.map(x=>x.length))+2)}">`;
        const parts=esc(it.q).split("___");
        return `<li><div class="q">${parts[0]}${inp}${parts[1]||""}${g==="warn"?` <span class="hint">check the accent: ${esc(it.a[0])}</span>`:""}${show?`<span class="sol">${esc(it.a[0])}</span>`:""}</div></li>`}).join("")}</ol>`;
    }else if(e.type==="choice"){
      inner=`<ol class="items">${e.items.map((it,ii)=>{
        const val=a[key(ii)];
        const parts=esc(it.q).split("___");
        const opts=`<span class="opts">${it.opts.map(o=>{let c="";if(st&&val===o)c=o===it.a?" ok":" bad";if(show&&o===it.a)c=" ok";return `<button class="opt${c}" aria-pressed="${val===o}" data-k="${key(ii)}" data-v="${esc(o)}">${esc(o)}</button>`}).join("")}</span>`;
        return `<li><div class="q">${parts.length>1?parts[0]+"<b>___</b>"+parts[1]:parts[0]} ${opts}</div></li>`}).join("")}</ol>`;
    }else{
      const val=a[key("w")]||""; const wc=val.trim()?val.trim().split(/\s+/).length:0;
      inner=`<textarea id="t-${f.id}-${ei}" data-k="${key("w")}" aria-label="Your text">${esc(val)}</textarea><div class="wc" id="wc-${ei}">${wc} words${e.min?` · aim for ${e.min}+`:""}</div>${show?`<div class="model"><div class="eyebrow" style="margin-bottom:4px">Model answer</div>${esc(e.model)}</div>`:""}`;
    }
    const acts=e.type==="write"
      ?`<button class="btn ghost" data-sol="${ei}">${show?"Hide model":"Show a model answer"}</button>`
      :`<button class="btn" data-chk="${ei}">Check</button><button class="btn ghost" data-sol="${ei}">${show?"Hide answers":"Show answers"}</button><button class="btn ghost" data-clr="${ei}">Clear</button>`;
    return `<section class="exo"><div class="hd"><h3>${ei+1}. ${esc(e.t)}</h3><span class="ref">${esc(e.ref)}</span></div><p class="instr">${esc(e.instr)}</p>${inner}<div class="actions">${acts}</div></section>`;
  }).join("");
  return `<header><h1>Fiches</h1><p class="lede">Practice for each unit, built from your textbook. Your answers stay on this device. Accents count, but a missing one is flagged rather than marked wrong.</p></header>${pick}
  <div class="eyebrow">${esc(f.ref)}</div><div class="sheet">${exos}</div>`;
}

function render(){
  tabs();
  const v={cours:vCours,grammaire:vGrammaire,verbes:vVerbes,phrases:vPhrases,vocab:vVocab,fiches:vFiches}[S.tab]||vCours;
  $("#view").innerHTML=v();
  bind();
}
function fa(){return S.ans[S.fiche]||(S.ans[S.fiche]={})}
function bind(){
  const V_=$("#view");
  V_.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{if(b.dataset.f)S.fiche=b.dataset.f;go(b.dataset.go,b.dataset.a)});
  V_.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{S.unit=+b.dataset.u;save();render()});
  V_.querySelectorAll("[data-vi]").forEach(b=>b.onclick=()=>{S.vi=+b.dataset.vi;save();render()});
  V_.querySelectorAll("[data-ti]").forEach(b=>b.onclick=()=>{S.ti=+b.dataset.ti;save();render()});
  const vm=$("#vm-verb"),vt=$("#vm-tense");
  if(vm){vm.onclick=()=>{S.vmode="verb";save();render()};vt.onclick=()=>{S.vmode="tense";save();render()}}
  if(S.tab!=="fiches")return;
  V_.querySelectorAll(".chip[data-f]").forEach(b=>b.onclick=()=>{S.fiche=b.dataset.f;save();render();window.scrollTo(0,0)});
  V_.querySelectorAll("input[data-k]").forEach(i=>i.oninput=()=>{fa()[i.dataset.k]=i.value;i.classList.remove("ok","bad","warn");save()});
  V_.querySelectorAll("textarea[data-k]").forEach(t=>t.oninput=()=>{fa()[t.dataset.k]=t.value;save();const ei=t.dataset.k.split(".")[0];const n=t.value.trim()?t.value.trim().split(/\s+/).length:0;const w=document.getElementById("wc-"+ei);if(w)w.textContent=w.textContent.replace(/^\d+/,n)});
  V_.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{fa()[b.dataset.k]=b.dataset.v;save();keep(()=>render())});
  V_.querySelectorAll("[data-chk]").forEach(b=>b.onclick=()=>{fa()["chk"+b.dataset.chk]=1;save();keep(()=>render())});
  V_.querySelectorAll("[data-sol]").forEach(b=>b.onclick=()=>{const k="sol"+b.dataset.sol;fa()[k]=!fa()[k];save();keep(()=>render())});
  V_.querySelectorAll("[data-clr]").forEach(b=>b.onclick=()=>{const ei=b.dataset.clr,A=fa();Object.keys(A).forEach(k=>{if(k.startsWith(ei+".")||k==="chk"+ei||k==="sol"+ei)delete A[k]});save();keep(()=>render())});
}
function keep(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
render();
</script>
</body>
</html>
