<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a2846">
<title>Carnet de Français</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a study notebook. Sticky tab bar; each tab is one section (course map, grammar, verbs, phrases, vocabulary, worksheets). Young Serif + Figtree, bordeaux ink.
   Language rule: every heading/label = French term + English underneath (.enl / <small>). Explanations, instructions, buttons = English. */
:root{
  --bg:#f8f5f6; --surface:#ffffff; --fg:#241519; --muted:#6e5a61; --line:#e6dbdf;
  --accent:#8a2846; --accent-soft:#f6e4ea; --irr:#a35f00;
  --ok:#2f7a4a; --ok-soft:#e3f2e8; --bad:#b3261e; --bad-soft:#fbe6e4; --warn:#8a6100; --warn-soft:#fbf0d6;
  --display:"Young Serif", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#170e11; --surface:#22161a; --fg:#f3e9ec; --muted:#b8a2aa; --line:#3a2830;
  --accent:#f19ab3; --accent-soft:#3b1d27; --irr:#e6b45c;
  --ok:#7fd19b; --ok-soft:#173022; --bad:#f2958d; --bad-soft:#3a1a18; --warn:#e8c46a; --warn-soft:#352a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170e11; --surface:#22161a; --fg:#f3e9ec; --muted:#b8a2aa; --line:#3a2830;
  --accent:#f19ab3; --accent-soft:#3b1d27; --irr:#e6b45c;
  --ok:#7fd19b; --ok-soft:#173022; --bad:#f2958d; --bad-soft:#3a1a18; --warn:#e8c46a; --warn-soft:#352a12; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .in{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.bar .in::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;color:var(--muted);font:600 14px/1.2 var(--body);padding:6px 12px;border-radius:8px;cursor:pointer;text-align:left}
.tab small{display:block;font-size:11px;font-weight:500;opacity:.8}
.tab[aria-selected="true"]{background:var(--accent);color:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:grid;gap:20px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1}
h2{font-size:26px;color:var(--accent)}
h3{margin:0;font-size:16px}
.h1en{margin:4px 0 0;font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.lede{margin:8px 0 0;color:var(--muted);max-width:64ch}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.enl{display:block;font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:1px}
.inline-en{font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 14px/1.25 var(--body);padding:6px 12px;border-radius:8px;cursor:pointer;text-align:left}
.chip small{display:block;font-size:11.5px;color:var(--muted)}
.chip.irr{color:var(--irr)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h3{color:var(--accent);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.card.wide{grid-column:1/-1}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.tag.irr{color:var(--irr)}
.tag.muted{background:none;border:1px solid var(--line);color:var(--muted)}
table{border-collapse:collapse;width:100%}
td,th{padding:6px 0;border-top:1px solid var(--line);vertical-align:baseline;text-align:left}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-right:10px;vertical-align:bottom}
th small,td.p small{display:block;font-size:11px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--muted)}
td.p{color:var(--muted);font-size:13px;width:34%;padding-right:8px}
td.rl{color:var(--fg);font-size:13px;font-weight:600;padding-right:8px}
td.rl small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
td.f{font-weight:600;padding-right:10px}
td.en{color:var(--muted);font-size:13.5px}
.fr{font-weight:600}
.tr{display:block;color:var(--muted);font-size:13.5px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.wide{min-width:900px}
.wide th,.wide td{padding:8px 12px;white-space:nowrap}
.wide td:first-child{font-family:var(--display);color:var(--accent);font-size:16px}
ul.ex{margin:8px 0 0;padding-left:18px;display:grid;gap:6px}
ul.ex li::marker{color:var(--accent)}
.note{font-size:13.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px;margin-top:10px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);width:max-content}
.toggle button{border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:6px 14px;border-radius:999px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
/* course map */
.units{display:grid;gap:10px}
.unit{display:grid;grid-template-columns:56px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;align-items:start}
.unit.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.unit .n{font-family:var(--display);font-size:34px;line-height:1;color:var(--accent)}
.unit .t{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.unit .t h3{font-family:var(--display);font-weight:400;font-size:20px}
.unit .t .ten{font-size:13.5px;color:var(--muted)}
.unit .pg{font-size:12.5px;color:var(--muted)}
.unit .rows{display:grid;gap:5px;margin-top:6px;font-size:13.5px}
.unit .rows b{color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.unit .rows b span{font-weight:500;text-transform:none;letter-spacing:0}
.unit .rows i{font-style:normal;color:var(--muted)}
.unit .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.linkbtn{border:1px solid var(--accent);background:none;color:var(--accent);font:600 13px var(--body);padding:4px 10px;border-radius:7px;cursor:pointer}
.setnow{border:0;background:none;color:var(--muted);font:500 12.5px var(--body);text-decoration:underline;cursor:pointer;padding:0}
/* worksheets */
.sheet{display:grid;gap:14px}
.exo{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;min-width:0}
.exo .hd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;justify-content:space-between}
.exo .hd h3{font-size:16px}
.exo .hd h3 .enl{font-size:13px}
.exo .hd .ref{font-size:12.5px;color:var(--muted)}
.exo .instr{margin:0;color:var(--muted);font-size:14px}
.items{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:it}
.items li{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:baseline;counter-increment:it}
.items li::before{content:counter(it, lower-alpha) ".";color:var(--accent);font-weight:600;font-size:13px}
.q{line-height:2.1}
.q input[type=text]{font:600 15px var(--body);color:var(--fg);background:var(--bg);border:0;border-bottom:1.5px solid var(--muted);padding:2px 4px;min-width:5ch;max-width:100%;border-radius:4px 4px 0 0}
.q input.long{width:min(100%,30ch)}
.q input.ok{border-color:var(--ok);background:var(--ok-soft)}
.q input.bad{border-color:var(--bad);background:var(--bad-soft)}
.q input.warn{border-color:var(--warn);background:var(--warn-soft)}
.q .hint{color:var(--muted);font-size:13px}
.q .sol{display:inline-block;margin-left:6px;font-size:13.5px;color:var(--ok);font-weight:600}
.opts{display:inline-flex;flex-wrap:wrap;gap:6px;margin-left:4px}
.opt{border:1px solid var(--line);background:var(--bg);color:var(--fg);font:600 13.5px var(--body);padding:3px 11px;border-radius:999px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;min-height:120px;font:15px/1.5 var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.wc{font-size:12.5px;color:var(--muted)}
.model{background:var(--accent-soft);border-radius:8px;padding:12px;font-size:14.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--bg);font:600 13.5px var(--body);padding:7px 14px;border-radius:8px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.wordbank{display:flex;flex-wrap:wrap;gap:6px}
.wordbank span{border:1px dashed var(--line);border-radius:6px;padding:2px 8px;font-size:13.5px;font-weight:600}
.cols2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:0 18px}
@media (prefers-reduced-motion:no-preference){.exo{transition:border-color .2s}}
</style>
</head>
<body>

<nav class="bar" aria-label="Sections"><div class="in" role="tablist" id="tabs"></div></nav>
<main class="wrap" id="view"></main>

<script>
/* bilingual helpers: French label with English underneath */
const TH=(fr,en)=>`<th>${fr}<small>${en}</small></th>`;
const RL=(fr,en)=>`<td class="rl">${fr}<small>${en}</small></td>`;
const EX=(fr,en)=>`<li><span class="fr">${fr}</span><span class="tr">${en}</span></li>`;

/* ---------- course map (from Édito A1, tableau des contenus) ---------- */
const UNITS=[
 {n:0,t:"Bienvenue !",en:"Welcome!",p:11,g:[["Les pronoms (je, tu… moi, toi, vous)","pronouns"],["Tu ou vous","informal or formal you"]],v:[["Les salutations","greetings"],["L'alphabet","the alphabet"],["Les nombres 0 à 31","numbers 0 to 31"],["Les jours et les mois","days and months"],["Dans la classe","in class"]],verbs:[],sheet:"f0",gr:1,ph:1,vo:1},
 {n:1,t:"Je suis…",en:"I am…",p:17,g:[["Les adjectifs de nationalité","nationality adjectives"],["Les articles définis le, la, l', les","the definite articles"],["Les prépositions devant les villes et pays (1)","prepositions with places"],["L'adjectif interrogatif quel","which, what"]],v:[["Les loisirs (1)","hobbies"],["Les nombres 32 à 100","numbers 32 to 100"],["Les pays et nationalités","countries and nationalities"],["L'identité, les coordonnées","identity, contact details"]],verbs:["avoir","s'appeler","être","parler"],sheet:"f1",gr:1,ph:1,vo:1},
 {n:2,t:"Près de moi",en:"Close to me",p:31,g:[["Articles définis et indéfinis","definite and indefinite articles"],["Les verbes en -er au présent","-er verbs in the present"],["Les adjectifs possessifs","my, your, his…"],["Masculin et féminin des professions","male and female job titles"]],v:[["Les lieux","places"],["Les loisirs (2)","hobbies"],["La famille","family"],["Les professions","jobs"]],verbs:["habiter","aimer"]},
 {n:3,t:"Qu'est-ce qu'on mange ?",en:"What are we eating?",p:45,g:[["Singulier et pluriel des noms","singular and plural nouns"],["Les prépositions de lieu (1)","prepositions of place"],["Les partitifs, un peu de, beaucoup de, pas de","some, a little, a lot, none"],["Les verbes en -ir (choisir, finir)","-ir verbs"]],v:[["Les commerces, les aliments","shops, food"],["Les quantités, le paiement","quantities, paying"],["Les repas, les boissons","meals, drinks"]],verbs:["acheter","payer","aller","manger","faire","finir"]},
 {n:4,t:"C'est où ?",en:"Where is it?",p:59,g:[["C'est un(e) / Il, elle est","it's a / he, she is"],["La fréquence (jamais, souvent, toujours)","how often"],["L'impératif","commands"],["Les connecteurs (pour, parce que, mais…)","linking words"]],v:[["La ville, les monuments","the city, landmarks"],["Les transports","transport"],["Les nombres 100 à 1 milliard","numbers 100 to a billion"]],verbs:["prendre"]},
 {n:5,t:"C'est tendance !",en:"It's trendy!",p:73,g:[["Genre et nombre des adjectifs","adjective agreement"],["La place des adjectifs","where adjectives go"],["L'adjectif démonstratif","this, that"]],v:[["Les vêtements, les couleurs","clothes, colours"],["La météo","the weather"],["Les objets du quotidien","everyday objects"]],verbs:["vendre","mettre","venir"]},
 {n:6,t:"Qu'est-ce qu'on fait aujourd'hui ?",en:"What are we doing today?",p:87,g:[["Les verbes pronominaux","reflexive verbs"],["La fréquence (2)","how often (2)"],["Le passé récent","have just done"],["Les verbes en -ir (2) partir, sortir, dormir","-ir verbs (2)"]],v:[["L'heure","telling the time"],["Les activités quotidiennes","daily routine"],["Les sorties","going out"],["Description physique, caractère","describing people"]],verbs:["pouvoir","vouloir","partir"]},
 {n:7,t:"Chez moi !",en:"At home!",p:101,g:[["Le passé composé (1) avec avoir","the past with avoir"],["Les prépositions de lieu (2)","prepositions of place (2)"],["L'obligation et l'interdiction (1)","must, must not"],["Les pronoms COD le, la, l', les","object pronouns"]],v:[["Le logement, les pièces, les meubles","home, rooms, furniture"],["L'immeuble, les réparations","the building, repairs"]],verbs:["connaître"]},
 {n:8,t:"En forme !",en:"Fit and well!",p:115,g:[["Le passé composé (2) avec être","the past with être"],["Le pronom y","the pronoun y (there)"],["L'obligation (2) devoir","must: devoir"],["Le conseil","giving advice"]],v:[["Le corps et la santé","the body and health"],["Le sport, l'alimentation","sport and diet"]],verbs:["devoir"]},
 {n:9,t:"Bonnes vacances !",en:"Happy holidays!",p:129,g:[["La comparaison","comparing"],["Les prépositions de villes et pays (2)","prepositions with places (2)"],["Le passé composé (3)","the past (3)"],["L'imparfait (c'était, il y avait, il faisait)","the imperfect"]],v:[["Les vacances, l'hébergement","holidays, accommodation"],["La nature","nature"]],verbs:[]},
 {n:10,t:"Au travail !",en:"At work!",p:143,g:[["Les pronoms COD (2)","object pronouns (2)"],["La durée","how long"],["Les pronoms relatifs qui et que","who, which, that"],["L'intensité","very, too, really"]],v:[["L'université, les études","university, studies"],["L'entreprise, la vie professionnelle","the company, working life"]],verbs:[]}
];

/* ---------- grammar ---------- */
const GR=[
 {id:"pronoms",u:0,t:"Les pronoms sujets et toniques",en:"Subject and stressed pronouns",
  h:`<table><tr>${TH("Sujet","subject")}${TH("Tonique","stressed")}${TH("Sens","meaning")}</tr>
  <tr><td class="f">je (j')</td><td class="f">moi</td><td class="en">I, me</td></tr>
  <tr><td class="f">tu</td><td class="f">toi</td><td class="en">you (informal)</td></tr>
  <tr><td class="f">il / elle / on</td><td class="f">lui / elle</td><td class="en">he / she / we</td></tr>
  <tr><td class="f">nous</td><td class="f">nous</td><td class="en">we</td></tr>
  <tr><td class="f">vous</td><td class="f">vous</td><td class="en">you (plural or polite)</td></tr>
  <tr><td class="f">ils / elles</td><td class="f">eux / elles</td><td class="en">they</td></tr></table>
  <p class="note">A French verb always needs its subject pronoun. The stressed form adds emphasis or stands alone: <i>Moi, je…</i>, <i>Et toi ?</i></p>
  <ul class="ex">${EX("Moi, je m'appelle Chefen. Et toi ?","My name's Chefen. And you?")}${EX("Bonjour monsieur, et vous ?","Hello sir, and you?")}</ul>`},
 {id:"tuvous",u:0,t:"Tu ou vous ?",en:"Informal or formal you",
  h:`<table><tr>${TH("Pronom","pronoun")}${TH("Pour qui","who it's for")}</tr>
  <tr><td class="f">tu</td><td class="en">family, friends, children, people your age in casual settings</td></tr>
  <tr><td class="f">vous</td><td class="en">someone you don't know, being polite, clients at work, and any group</td></tr></table>
  <ul class="ex">${EX("Salut Léa, tu vas bien ?","Hi Léa, are you well?")}${EX("Bonjour madame, vous allez bien ?","Hello madam, are you well?")}</ul>
  <p class="note">When in doubt, use <i>vous</i>. The other person will tell you if <i>tu</i> is fine: <i>On peut se tutoyer ?</i> (Shall we use tu?)</p>`},
 {id:"negation",u:0,t:"La négation ne… pas",en:"Saying not",lv:1,
  h:`<p><b>ne</b> goes before the verb and <b>pas</b> after it. <b>ne</b> becomes <b>n'</b> before a vowel.</p>
  <ul class="ex">${EX("Je ne comprends pas.","I don't understand.")}${EX("Je n'aime pas le sport.","I don't like sport.")}${EX("Elle n'est pas française.","She isn't French.")}</ul>
  <p class="note">In speech the <i>ne</i> often disappears: <i>Je sais pas.</i> Keep it when you write.</p>`},
 {id:"nationalite",u:1,t:"Les adjectifs de nationalité",en:"Nationality adjectives",
  h:`<table><tr>${TH("Règle","rule")}${TH("Masculin","masculine")}${TH("Féminin","feminine")}</tr>
  <tr><td class="p">add -e</td><td class="f">français</td><td class="f">française</td></tr>
  <tr><td class="p">add -e</td><td class="f">allemand</td><td class="f">allemande</td></tr>
  <tr><td class="p">-ien → -ienne</td><td class="f">italien</td><td class="f">italienne</td></tr>
  <tr><td class="p">-éen → -éenne</td><td class="f">coréen</td><td class="f">coréenne</td></tr>
  <tr><td class="p">ends in -e: no change</td><td class="f">suisse</td><td class="f">suisse</td></tr>
  <tr><td class="p">special</td><td class="f">grec / turc</td><td class="f">grecque / turque</td></tr></table>
  <p class="note">Listen for the difference: the final consonant is silent in the masculine and pronounced in the feminine (<i>françai<b>s</b></i> vs <i>françai<b>se</b></i>). Nationality adjectives take no capital letter.</p>
  <ul class="ex">${EX("Il est suédois. Elle est suédoise.","He is Swedish. She is Swedish.")}${EX("Vous êtes portugaise, madame ?","Are you Portuguese, madam?")}</ul>`},
 {id:"articles",u:1,t:"Les articles définis le, la, l', les",en:"The definite articles: the",
  h:`<table><tr><th></th>${TH("Singulier","singular")}${TH("Pluriel","plural")}</tr>
  <tr>${RL("Masculin","masculine")}<td class="f">le / l'</td><td class="f" rowspan="2">les</td></tr>
  <tr>${RL("Féminin","feminine")}<td class="f">la / l'</td></tr></table>
  <p>Use <b>l'</b> before a vowel or a silent h: <i>l'art, l'histoire</i>.<br>Use the article to talk about things in general, especially after <i>aimer</i>: <i>J'aime <b>la</b> musique.</i> (I like music.)</p>
  <p class="note">Countries take an article. Ending in -e: feminine (<i>la France, l'Italie</i>). Exceptions: <i>le Mexique, le Mozambique, le Cambodge, le Zimbabwe</i>. Ending in -s: plural (<i>les États-Unis, les Pays-Bas</i>).</p>`},
 {id:"prepositions",u:1,t:"À, au, en, aux + villes et pays",en:"In or to a city or country",
  h:`<table><tr>${TH("Devant","before")}${TH("On dit","use")}${TH("Exemple","example")}</tr>
  <tr><td class="p">a city</td><td class="f">à</td><td>à Lisbonne, à Göteborg</td></tr>
  <tr><td class="p">a masculine country</td><td class="f">au</td><td>au Portugal, au Japon</td></tr>
  <tr><td class="p">a feminine country, or one starting with a vowel</td><td class="f">en</td><td>en Suède, en France, en Iran</td></tr>
  <tr><td class="p">a plural country</td><td class="f">aux</td><td>aux États-Unis, aux Pays-Bas</td></tr></table>
  <ul class="ex">${EX("J'habite à Lisbonne, au Portugal.","I live in Lisbon, in Portugal.")}${EX("Il est né en Argentine.","He was born in Argentina.")}</ul>`},
 {id:"quel",u:1,t:"L'adjectif interrogatif quel",en:"Which, what",
  h:`<table><tr><th></th>${TH("Singulier","singular")}${TH("Pluriel","plural")}</tr>
  <tr>${RL("Masculin","masculine")}<td class="f">quel</td><td class="f">quels</td></tr>
  <tr>${RL("Féminin","feminine")}<td class="f">quelle</td><td class="f">quelles</td></tr></table>
  <p><b>quel</b> means "which" or "what" and agrees with the noun it goes with. All four forms sound the same.</p>

   {q:"Le bureau est ___ Suède, à Göteborg.",opts:["à","au","en","aux"],a:"en"},
   {q:"Elle habite ___ États-Unis.",opts:["à","au","en","aux"],a:"aux"},
   {q:"Il est né ___ Japon.",opts:["à","au","en","aux"],a:"au"},
   {q:"Nous habitons ___ Italie.",opts:["à","au","en","aux"],a:"en"},
   {q:"Ils sont nés ___ Pays-Bas.",opts:["à","au","en","aux"],a:"aux"},
   {q:"Elle est née ___ Bruxelles.",opts:["à","au","en","aux"],a:"à"},
   {q:"Il habite ___ Canada.",opts:["à","au","en","aux"],a:"au"},
   {q:"Je suis né ___ Argentine.",opts:["à","au","en","aux"],a:"en"}]},
  {t:"Quel, quelle, quels, quelles",en:"Which, what",ref:"Textbook p. 26",instr:"Complete with the right form of quel.",type:"input",items:[
   {q:"___ est ton numéro de téléphone ?",a:["quel"]},
   {q:"Tu as ___ âge ?",a:["quel"]},
   {q:"Tu habites dans ___ ville ?",a:["quelle"]},
   {q:"Tu parles ___ langues ?",a:["quelles"]},
   {q:"Tu aimes ___ sports ?",a:["quels"]},
   {q:"___ est ta nationalité ?",a:["quelle"]}]},
  {t:"Les nombres 32 à 100",en:"Numbers 32 to 100",ref:"Textbook pp. 21, 27",instr:"Write the number in words.",type:"input",items:[
   {q:"44 → ___",a:["quarante-quatre"]},{q:"61 → ___",a:["soixante et un"]},{q:"70 → ___",a:["soixante-dix"]},
   {q:"75 → ___",a:["soixante-quinze"]},{q:"80 → ___",a:["quatre-vingts"]},{q:"81 → ___",a:["quatre-vingt-un"]},
   {q:"92 → ___",a:["quatre-vingt-douze"]},{q:"99 → ___",a:["quatre-vingt-dix-neuf"]}]},
  {t:"En français",en:"Translate into French",ref:"Textbook pp. 18–27",instr:"Translate.",type:"input",items:[
   {q:"I'm thirty years old. → ___",a:["j'ai trente ans","j'ai 30 ans"],long:1},
   {q:"What's your name? (tu) → ___",a:["comment tu t'appelles","tu t'appelles comment","comment t'appelles-tu"],long:1},
   {q:"I live in Lisbon, in Portugal. → ___",a:["j'habite à lisbonne au portugal"],long:1},
   {q:"I like music and cinema. → ___",a:["j'aime la musique et le cinéma"],long:1},
   {q:"Read out: chefen@gmail.com → ___",a:["chefen arobase gmail point com"],long:1}]},
  {t:"À vous !",en:"Your turn",ref:"Writing · DELF practice",instr:"You are signing up to a language-exchange app. Introduce yourself: name, nationality, age, where you live, languages, likes. 40 words minimum.",type:"write",min:40,model:"Bonjour ! Je m'appelle Chefen. J'ai trente ans et j'habite à Lisbonne, au Portugal. Je travaille dans la logistique. Je parle anglais et un peu portugais. J'apprends le français. J'aime la musique, le cinéma et le sport. Et toi, tu parles quelles langues ?"}
 ]}
];

/* ---------- state ---------- */
let S={tab:"cours",unit:1,vi:0,ti:0,vmode:"verb",fiche:"f1",ans:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("carnet")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("carnet",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const B=(fr,en)=>`${esc(fr)}<span class="enl">${esc(en)}</span>`;
const EB=(fr,en)=>`<div class="eyebrow">${esc(fr)} <span class="inline-en">· ${esc(en)}</span></div>`;
const head=(fr,en,lede)=>`<header><h1>${esc(fr)}</h1><p class="h1en">${esc(en)}</p>${lede?`<p class="lede">${lede}</p>`:""}</header>`;
const TABS=[["cours","Mon cours","My course"],["grammaire","Grammaire","Grammar"],["verbes","Verbes","Verbs"],["phrases","Phrases","Phrases"],["vocab","Vocabulaire","Vocabulary"],["fiches","Fiches","Worksheets"]];

function tabs(){
  $("#tabs").innerHTML=TABS.map(([k,fr,en])=>`<button class="tab" role="tab" aria-selected="${S.tab===k}" data-k="${k}">${fr}<small>${en}</small></button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.k));
}
function go(k,anchor){S.tab=k;save();render();if(anchor){const el=document.getElementById(anchor);if(el){el.scrollIntoView({block:"start"});return}}window.scrollTo(0,0)}
const utag=u=>u==null?"":`<span class="tag muted">Unité ${u} · unit ${u}</span>`;
const pairList=l=>l.map(([fr,en])=>`${esc(fr)} <i>(${esc(en)})</i>`).join(" · ");

/* views */
function vCours(){
  return head("Carnet de français","French notebook","Your companion to Édito A1. Find a unit, review the rules, then do its worksheet. Page numbers point to your textbook.")+
  `<div class="units">${UNITS.map(u=>{
    const now=u.n===S.unit;
    const links=[u.sheet?`<button class="linkbtn" data-go="fiches" data-f="${u.sheet}">Worksheet ${u.n}</button>`:"",
      u.gr?`<button class="linkbtn" data-go="grammaire" data-a="u${u.n}g">Grammar</button>`:"",
      u.vo?`<button class="linkbtn" data-go="vocab" data-a="u${u.n}v">Vocabulary</button>`:"",
      u.ph?`<button class="linkbtn" data-go="phrases" data-a="u${u.n}p">Phrases</button>`:""].join("");
    return `<div class="unit${now?" now":""}"><div class="n">${u.n}</div><div style="min-width:0">
      <div class="t"><h3>${esc(u.t)}</h3><span class="ten">${esc(u.en)}</span><span class="pg">p. ${u.p}</span>${now?`<span class="tag">You are here</span>`:`<button class="setnow" data-u="${u.n}">I'm on this unit</button>`}</div>
      <div class="rows"><div><b>Grammaire <span>· grammar</span></b>${pairList(u.g)}</div><div><b>Vocabulaire <span>· vocabulary</span></b>${pairList(u.v)}</div>${u.verbs.length?`<div><b>Verbes <span>· verbs</span></b>${u.verbs.join(", ")}</div>`:""}</div>
      ${links?`<div class="links">${links}</div>`:`<div class="pg" style="margin-top:6px">Worksheet and notes are added when you reach this unit.</div>`}
    </div></div>`}).join("")}</div>`;
}
function grouped(list,suffix,renderItem){
  const us=[...new Set(list.map(x=>x.u))];
  return us.map(u=>`<section id="u${u}${suffix}" style="display:grid;gap:12px;scroll-margin-top:80px">${EB("Unité "+u+" · "+UNITS[u].t,"Unit "+u+", "+UNITS[u].en)}<div class="grid">${list.filter(x=>x.u===u).map(renderItem).join("")}</div></section>`).join("");
}
function vGrammaire(){
  return head("Grammaire","Grammar","One card per rule, in the order your book teaches them.")+
   grouped(GR,"g",g=>`<div class="card"><h3>${esc(g.t)}${g.lv?` <span class="tag muted" style="margin-left:6px">Preview</span>`:""}<span class="enl">${esc(g.en)}${g.lv?". Taught later in the book.":""}</span></h3>${g.h}</div>`);
}
function rows(r){return `<table>${r.map(([a,b])=>`<tr><td class="f">${esc(a)}</td><td class="en">${esc(b)}</td></tr>`).join("")}</table>`}
function vPhrases(){
  return head("Phrases","Phrases","Ready-to-use sentences, grouped by situation.")+
   grouped(PH,"p",p=>`<div class="card"><h3>${B(p.t,p.en)}</h3>${rows(p.r)}</div>`);
}
function vVocab(){
  return head("Vocabulaire","Vocabulary","Word lists by topic. (m.) and (f.) mark masculine and feminine.")+
   grouped(VO,"v",v=>`<div class="card${v.wide?" wide":""}"><h3>${B(v.t,v.en)}</h3>${v.wide?`<div class="cols2">${v.r.map(([a,b])=>`<div style="display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:5px 0"><span class="fr">${esc(a)}</span><span style="color:var(--muted);font-size:13.5px;text-align:right">${esc(b)}</span></div>`).join("")}</div>`:rows(v.r)}${v.note?`<p class="note">${esc(v.note)}</p>`:""}</div>`);
}
const pron=(i,f)=>i===0&&/^[aeiouyhéèêâîôû]/i.test(f)?"j'":PERSONS[i];
function vVerbes(){
  const top=head("Verbes","Verbs",`${V.length} verbs in six tenses. The tag shows the unit where your book introduces each one. At A1, focus on the présent, then the passé composé from Unit 7.`)+`
  <div class="toggle" role="group" aria-label="View"><button id="vm-verb" aria-pressed="${S.vmode==="verb"}">By verb</button><button id="vm-tense" aria-pressed="${S.vmode==="tense"}">By tense</button></div>`;
  let pick,body;
  if(S.vmode==="verb"){
    const x=V[S.vi]||V[0];
    pick=`<div class="chips">${V.map((y,i)=>`<button class="chip${y.irr?" irr":""}" aria-pressed="${i===S.vi}" data-vi="${i}">${esc(y.v)}</button>`).join("")}</div>
    <p class="note" style="margin:0">Irregular verbs are shown in <span style="color:var(--irr);font-weight:600">${"ochre"}</span>.</p>`;
    body=`<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px"><h2 style="font-size:32px">${esc(x.v)}</h2><span style="font-size:16px">${esc(x.g)}</span><span class="tag${x.irr?" irr":""}">${x.irr?"irrégulier · irregular":"régulier · regular"}</span>${utag(x.u)}</div>
    <table style="width:auto"><tr>${RL("Participe passé","past participle")}<td class="f">${x.pp}${x.note?` <span class="en" style="font-weight:400">(${x.note})</span>`:""}</td></tr><tr>${RL("Auxiliaire","helper verb in the passé composé")}<td class="f">${x.aux}</td></tr></table>
    <div class="card" style="padding:12px 16px">${EB("Exemple","Example")}<p style="margin:4px 0 0"><span class="fr">${esc(x.ex)}</span><span class="tr">${esc(x.exen)}</span></p></div>
    <div class="grid">${TENSES.map(([k,n,en,u])=>`<div class="card"><h3>${B(n,en)}</h3><p style="margin:0 0 8px;font-size:12.5px;color:var(--muted)">${u}</p><table>${PERSONS.map((p,i)=>`<tr><td class="p">${pron(i,x[k][i])}</td><td class="f">${x[k][i]}</td></tr>`).join("")}</table></div>`).join("")}</div>`;
  }else{
    const [k,n,en,u]=TENSES[S.ti];
    pick=`<div class="chips">${TENSES.map((t,i)=>`<button class="chip" aria-pressed="${i===S.ti}" data-ti="${i}">${t[1]}<small>${t[2]}</small></button>`).join("")}</div>`;
    body=`<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px"><h2 style="font-size:32px">${n}</h2><span style="font-size:16px">${en}</span><span style="color:var(--muted)">${u}</span></div>
    <div class="scroll"><table class="wide"><thead><tr>${TH("Verbe","verb")}${PERSONS.map(p=>`<th>${p}</th>`).join("")}</tr></thead><tbody>${V.map(x=>`<tr><td${x.irr?` style="color:var(--irr)"`:""}>${esc(x.v)}</td>${x[k].map((f,i)=>`<td>${i===0&&pron(0,f)==="j'"?"j'"+f:f}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  return top+pick+`<section style="display:grid;gap:14px">${body}</section>`;
}

/* worksheets */
const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[?!.,;:«»"]/g," ").replace(/-/g," ").replace(/'\s+/g,"'").replace(/\s+/g," ").trim();
const deacc=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
function grade(val,answers){
  const v=norm(val||""); if(!v) return "";
  const A=answers.map(norm);
  if(A.includes(v)) return "ok";
  if(A.map(deacc).includes(deacc(v))) return "warn";
  return "bad";
}
function vFiches(){
  const f=FICHES.find(x=>x.id===S.fiche)||FICHES[0];
  const a=S.ans[f.id]||{};
  const pick=`<div class="chips">${FICHES.map(x=>`<button class="chip" aria-pressed="${x.id===f.id}" data-f="${x.id}">${esc(x.t)}<small>${esc(x.en)}</small></button>`).join("")}</div>`;
  const exos=f.exos.map((e,ei)=>{
    const key=k=>`${ei}.${k}`;
    const st=a["chk"+ei], show=a["sol"+ei];
    let inner="";
    if(e.type==="input"){
      inner=`${e.bank?`<div class="wordbank">${e.bank.map(w=>`<span>${esc(w)}</span>`).join("")}</div>`:""}<ol class="items">${e.items.map((it,ii)=>{
        const val=a[key(ii)]||""; const g=st?grade(val,it.a):"";
        const inp=`<input type="text" id="i-${f.id}-${ei}-${ii}" data-k="${key(ii)}" class="${it.long?"long ":""}${g}" value="${esc(val)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer ${ii+1}" size="${it.long?28:Math.max(6,Math.max(...it.a.map(x=>x.length))+2)}">`;
        const parts=esc(it.q).split("___");
        return `<li><div class="q">${parts[0]}${inp}${parts[1]||""}${g==="warn"?` <span class="hint">check the accent: ${esc(it.a[0])}</span>`:""}${show?`<span class="sol">${esc(it.a[0])}</span>`:""}</div></li>`}).join("")}</ol>`;
    }else if(e.type==="choice"){
      inner=`<ol class="items">${e.items.map((it,ii)=>{
        const val=a[key(ii)];
        const parts=esc(it.q).split("___");
        const opts=`<span class="opts">${it.opts.map(o=>{let c="";if(st&&val===o)c=o===it.a?" ok":" bad";if(show&&o===it.a)c=" ok";return `<button class="opt${c}" aria-pressed="${val===o}" data-k="${key(ii)}" data-v="${esc(o)}">${esc(o)}</button>`}).join("")}</span>`;
        return `<li><div class="q">${parts.length>1?parts[0]+"<b>___</b>"+parts[1]:parts[0]} ${opts}</div></li>`}).join("")}</ol>`;
    }else{
      const val=a[key("w")]||""; const wc=val.trim()?val.trim().split(/\s+/).length:0;
      inner=`<textarea id="t-${f.id}-${ei}" data-k="${key("w")}" aria-label="Your text">${esc(val)}</textarea><div class="wc" id="wc-${ei}">${wc} words${e.min?` · aim for ${e.min}+`:""}</div>${show?`<div class="model">${EB("Modèle","Model answer")}<div style="margin-top:4px">${esc(e.model)}</div></div>`:""}`;
    }
    const acts=e.type==="write"
      ?`<button class="btn ghost" data-sol="${ei}">${show?"Hide model answer":"Show a model answer"}</button>`
      :`<button class="btn" data-chk="${ei}">Check</button><button class="btn ghost" data-sol="${ei}">${show?"Hide answers":"Show answers"}</button><button class="btn ghost" data-clr="${ei}">Clear</button>`;
    return `<section class="exo"><div class="hd"><h3>${ei+1}. ${B(e.t,e.en)}</h3><span class="ref">${esc(e.ref)}</span></div><p class="instr">${esc(e.instr)}</p>${inner}<div class="actions">${acts}</div></section>`;
  }).join("");
  return head("Fiches","Worksheets","Practice for each unit, built from your textbook. Your answers stay on this device. Accents count, but a missing one is flagged rather than marked wrong.")+`${pick}
  <p class="lede" style="margin:0">${esc(f.ref)}</p><div class="sheet">${exos}</div>`;
}

function render(){
  tabs();
  const v={cours:vCours,grammaire:vGrammaire,verbes:vVerbes,phrases:vPhrases,vocab:vVocab,fiches:vFiches}[S.tab]||vCours;
  $("#view").innerHTML=v();
  bind();
}
function fa(){return S.ans[S.fiche]||(S.ans[S.fiche]={})}
function bind(){
  const V_=$("#view");
  V_.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{if(b.dataset.f)S.fiche=b.dataset.f;go(b.dataset.go,b.dataset.a)});
  V_.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{S.unit=+b.dataset.u;save();render()});
  V_.querySelectorAll("[data-vi]").forEach(b=>b.onclick=()=>{S.vi=+b.dataset.vi;save();render()});
  V_.querySelectorAll("[data-ti]").forEach(b=>b.onclick=()=>{S.ti=+b.dataset.ti;save();render()});
  const vm=$("#vm-verb"),vt=$("#vm-tense");
  if(vm){vm.onclick=()=>{S.vmode="verb";save();render()};vt.onclick=()=>{S.vmode="tense";save();render()}}
  if(S.tab!=="fiches")return;
  V_.querySelectorAll(".chip[data-f]").forEach(b=>b.onclick=()=>{S.fiche=b.dataset.f;save();render();window.scrollTo(0,0)});
  V_.querySelectorAll("input[data-k]").forEach(i=>i.oninput=()=>{fa()[i.dataset.k]=i.value;i.classList.remove("ok","bad","warn");save()});
  V_.querySelectorAll("textarea[data-k]").forEach(t=>t.oninput=()=>{fa()[t.dataset.k]=t.value;save();const ei=t.dataset.k.split(".")[0];const n=t.value.trim()?t.value.trim().split(/\s+/).length:0;const w=document.getElementById("wc-"+ei);if(w)w.textContent=w.textContent.replace(/^\d+/,n)});
  V_.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{fa()[b.dataset.k]=b.dataset.v;save();keep(()=>render())});
  V_.querySelectorAll("[data-chk]").forEach(b=>b.onclick=()=>{fa()["chk"+b.dataset.chk]=1;save();keep(()=>render())});
  V_.querySelectorAll("[data-sol]").forEach(b=>b.onclick=()=>{const k="sol"+b.dataset.sol;fa()[k]=!fa()[k];save();keep(()=>render())});
  V_.querySelectorAll("[data-clr]").forEach(b=>b.onclick=()=>{const ei=b.dataset.clr,A=fa();Object.keys(A).forEach(k=>{if(k.startsWith(ei+".")||k==="chk"+ei||k==="sol"+ei)delete A[k]});save();keep(()=>render())});
}
function keep(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
render();
</script>
</body>
</html>
